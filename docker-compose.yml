# LeadGen v2 worker fleet.
#
#   docker compose up -d                          # Phase 2 set (default profile)
#   docker compose --profile full up -d           # every worker role
#   docker compose up -d --scale crawl-worker=3
#   docker compose logs -f verify-svc
#
# ── Memory ───────────────────────────────────────────────────────────────────
# This box also runs Odoo and n8n. Every service has an explicit mem_limit so a
# crawl spike cannot starve them. Default profile totals 5.75 GB; `full` adds
# three more workers for 7.25 GB. See docs/DEPLOY.md for the arithmetic.
#
# ── Database ─────────────────────────────────────────────────────────────────
# There is no pgbouncer in the default path, deliberately. Supabase's Supavisor
# already provides transaction pooling on :6543 and session pooling on :5432,
# and chaining our own pooler in front of it buys nothing while making prepared
# statements and connection debugging harder. The pgbouncer service below is
# kept behind the `local-pool` profile for the day this points at self-hosted
# Postgres.
#
# `db.<ref>.supabase.co` is NOT usable: Supabase dropped IPv4 for direct
# connections and it now resolves AAAA-only. Both URLs go through the pooler
# hostname, which has A records.

x-worker-base: &worker-base
  build:
    context: ./workers
    dockerfile: Dockerfile
  restart: unless-stopped
  mem_limit: 512m
  memswap_limit: 512m
  environment: &worker-env
    DATABASE_URL: ${DATABASE_URL}
    DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT}
    SUPABASE_URL: ${SUPABASE_URL}
    SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    DECODO_USERNAME: ${DECODO_USERNAME}
    DECODO_PASSWORD: ${DECODO_PASSWORD}
    DECODO_HOST: ${DECODO_HOST}
    DECODO_PORT: ${DECODO_PORT}
    DECODO_STICKY_TTL: ${DECODO_STICKY_TTL:-600}
    # These three are set in .env but were never passed into the containers, so
    # every worker logged them as missing at boot. Behaviour was correct anyway
    # — config.ts defaults country to 'us' and the ports to 10001-10100 — but
    # three false "optional config missing" warnings on every start is exactly
    # the noise that hides a real one.
    DECODO_COUNTRY: ${DECODO_COUNTRY:-us}
    DECODO_STICKY_PORT_MIN: ${DECODO_STICKY_PORT_MIN:-10001}
    DECODO_STICKY_PORT_MAX: ${DECODO_STICKY_PORT_MAX:-10100}
    SEARXNG_URL: http://searxng:8080
    # SERP transport. Empty SERPER_API_KEY keeps the self-hosted instance, paced
    # to what Google CSE tolerates — the only upstream that honours `site:`.
    # Setting the key switches provider with no code change; SERP_PROVIDER
    # forces one either way for an A/B. See workers/src/sources/serp-provider.ts.
    SERPER_API_KEY: ${SERPER_API_KEY:-}
    SERP_PROVIDER: ${SERP_PROVIDER:-}
    SEARXNG_MIN_QUERY_INTERVAL_MS: ${SEARXNG_MIN_QUERY_INTERVAL_MS:-16700}
    SERPER_MAX_QUERIES_PER_CAMPAIGN: ${SERPER_MAX_QUERIES_PER_CAMPAIGN:-500}
    # Provider mailbox lookup. Bought only when the free sources and the whole
    # pattern ladder produce nothing deliverable — the state 12.5% of businesses
    # end in. See workers/src/sources/mailbox-provider.ts.
    HUNTER_API_KEY: ${HUNTER_API_KEY:-}
    MAILBOX_PROVIDER: ${MAILBOX_PROVIDER:-}
    HUNTER_MAX_LOOKUPS_PER_CAMPAIGN: ${HUNTER_MAX_LOOKUPS_PER_CAMPAIGN:-500}
    CRAWL4AI_URL: http://crawl4ai:11235
    GOOGLE_MAPS_SCRAPER_URL: http://maps-scraper:8080
    GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
    SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN}
    # Statewide officer search when the county scope misses. Bounded at 2
    # matching entities inside registry-match, so a common name is rejected
    # rather than attached to the wrong business.
    REGISTRY_REVERSE_STATEWIDE: ${REGISTRY_REVERSE_STATEWIDE:-true}
    # Abort a registry ingest once the database reaches this many MB. Supabase's
    # free plan stops at 500 MB and a project that reaches it goes read-only,
    # which takes down the whole fleet and not just the ingest. Raise this only
    # alongside more disk.
    # The registries live in their own local Postgres, not in Supabase — see
    # the registry-db service below for why. Only the `registry` role reads it.
    REGISTRY_DATABASE_URL: postgres://${REGISTRY_DB_USER:-registry}:${REGISTRY_DB_PASSWORD}@registry-db:5432/${REGISTRY_DB_NAME:-registry}
    # Abort a registry ingest once registry-db's own disk use reaches this. The
    # host has 122 GB free and also runs Odoo, n8n and three other Postgres
    # instances, so the ceiling is about being a good neighbour rather than
    # about a plan limit.
    REGISTRY_MAX_DB_MB: ${REGISTRY_MAX_DB_MB:-20000}
    # The four extra candidate shapes measured as a straight loss on the
    # med spa benchmark. Off unless a niche justifies re-measuring.
    PATTERN_LADDER_EXTRAS: ${PATTERN_LADDER_EXTRAS:-false}
    # Queries per discovery batch. 48 made gosom fall over; 36 did not.
    MAPS_MAX_QUERIES: ${MAPS_MAX_QUERIES:-36}
    # Scroll depth per query. Was 10; the filters keep ~3 per query, so most
    # of those pages were fetched, rendered and discarded.
    MAPS_DEPTH: ${MAPS_DEPTH:-5}
    # gosom egresses through proxy-meter, which counts and blocks.
    MAPS_PROXY_METER_URL: ${MAPS_PROXY_METER_URL:-http://proxy-meter:8090}
    # Locks older than this are presumed to belong to a killed worker.
    # Must exceed the longest job (maps:discover, up to 45 min).
    STALE_LOCK_MINUTES: ${STALE_LOCK_MINUTES:-60}
    # verify-svc uses host networking, so it is reached via the gateway.
    VERIFY_URL: http://host.docker.internal:8080
    VERIFY_IPS: ${VERIFY_IPS}
    VERIFY_HELO_DOMAIN: ${VERIFY_HELO_DOMAIN}
    VERIFY_FROM_EMAIL: ${VERIFY_FROM_EMAIL}
    VERIFIER: ${VERIFIER:-hybrid}
    VERIFALIA_USERNAME: ${VERIFALIA_USERNAME}
    VERIFALIA_PASSWORD: ${VERIFALIA_PASSWORD}
    VERIFALIA_MAX_CENTS_PER_CAMPAIGN: ${VERIFALIA_MAX_CENTS_PER_CAMPAIGN:-500}
    LINKEDIN_ACCOUNTS: ${LINKEDIN_ACCOUNTS}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    METRICS_PORT: 9100
    # Hostinger's IPv6 is unreliable and Node black-holes on it rather than
    # falling back. Stays on until proven unnecessary.
    FORCE_IPV4: ${FORCE_IPV4:-true}
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # ── verification ────────────────────────────────────────────────────────────
  #
  # host networking is required: the prober binds outbound connections to
  # specific public IPs, which is impossible from Docker's bridge network.
  verify-svc:
    build:
      context: ./verify-svc
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      DATABASE_URL: ${DATABASE_URL_DIRECT}
      VERIFY_IPS: ${VERIFY_IPS}
      VERIFY_HELO_DOMAIN: ${VERIFY_HELO_DOMAIN}
      VERIFY_FROM_EMAIL: ${VERIFY_FROM_EMAIL}
      PORT: "8080"

  # ── proxy-meter ─────────────────────────────────────────────────────────────
  #
  # Sits between gosom and Decodo. Every other egress goes through ProxyPool,
  # which counts bytes exactly; gosom drives its own Chromium in a separate
  # process and was therefore the one unmeasured stage — and the one with a
  # browser in it. This counts it, blocks the hosts whose bytes we discard
  # (tiles, photos, fonts, analytics), and refuses new connections once a
  # budget is spent.
  #
  # Loopback-published like everything else; only maps-scraper talks to it.
  proxy-meter:
    build:
      context: ./proxy-meter
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      METER_PORT: "8090"
      DECODO_HOST: ${DECODO_HOST}
      DECODO_PORT: ${DECODO_PORT}
      DECODO_USERNAME: ${DECODO_USERNAME}
      DECODO_PASSWORD: ${DECODO_PASSWORD}
      DECODO_COUNTRY: ${DECODO_COUNTRY:-us}
      # Set false to measure the unoptimised baseline.
      METER_BLOCKING: ${METER_BLOCKING:-true}
      # www.gstatic.com carries the JS bundle Google Maps needs to render, and
      # gosom reads the rendered DOM. Blocking it saved 37 MB of 154 and
      # returned ZERO businesses — tested, not assumed. Left off; the flag
      # exists so the experiment is repeatable, not because it should be on.
      METER_BLOCK_GSTATIC: ${METER_BLOCK_GSTATIC:-false}
      METER_BUDGET_BYTES: ${METER_BUDGET_BYTES:-0}
    ports:
      - "127.0.0.1:8090:8090"

  # ── SERP ────────────────────────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    ports:
      - "127.0.0.1:8888:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── crawling ────────────────────────────────────────────────────────────────
  #
  # crawl4ai bundles its own Playwright browsers, so there is no separate
  # playwright service in the default path — it would be 2 GB of duplicate
  # runtime. The standalone image stays behind the `full` profile for the
  # bespoke-automation cases Phase 4 may need.
  crawl4ai:
    image: unclecode/crawl4ai:latest
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    shm_size: 1gb
    environment:
      # crawl4ai takes the credentials as separate fields, which is the form it
      # supports; it does its own auth handling for the browser. Country
      # targeting uses Decodo's `user-<name>-country-<cc>` form, without which
      # the pool hands out random global exits.
      #
      # This container is currently INERT — no job calls crawl4ai. The crawl
      # stage fetches directly and escalates through ProxyPool on undici, which
      # handles proxy credentials natively.
      PROXY_SERVER: http://${DECODO_HOST}:${DECODO_PORT}
      PROXY_USERNAME: user-${DECODO_USERNAME}-country-${DECODO_COUNTRY:-us}
      PROXY_PASSWORD: ${DECODO_PASSWORD}
    ports:
      - "127.0.0.1:11235:11235"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:11235/health',timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  playwright:
    profiles: ["full"]
    image: mcr.microsoft.com/playwright:v1.49.0-jammy
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    shm_size: 1gb
    command: ["npx", "-y", "playwright@1.49.0", "run-server", "--port", "3300", "--host", "0.0.0.0"]
    expose: ["3300"]

  # ── Decodo auth-forwarding proxy (retained, currently unused) ───────────────
  #
  # Built on the assumption that Chromium's inability to take credentials in a
  # --proxy-server URL was what broke Maps discovery. It is not: gosom runs its
  # own internal AuthProxy for exactly that purpose and *requires* credentials in
  # the URL it is given. Pointing it here produced
  #   "failed to start auth proxy for http://decodo-proxy:8080:
  #    username and password are required"
  # and no scrape at all.
  #
  # Kept because it is correct and tested for any Chromium-driving component that
  # does NOT do its own auth — the standalone playwright service under the `full`
  # profile is the likely candidate. Nothing points at it today. Verified working:
  # exits US, sticky within a session.
  decodo-proxy:
    profiles: ["full"]
    image: ginuerzh/gost:2.11.5
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    expose: ["8080"]
    # `user-<name>-country-<cc>` is Decodo's geo-targeting form; the bare
    # username yields a random global exit (first test came out of Córdoba,
    # Argentina). A sticky port holds one exit for a whole session — and holds it
    # past a country change, so a port with a live foreign session must be
    # swapped rather than reconfigured.
    command: >
      -L=http://:8080
      -F=http://user-${DECODO_USERNAME}-country-${DECODO_COUNTRY:-us}:${DECODO_PASSWORD}@${DECODO_HOST}:${DECODO_MAPS_STICKY_PORT:-10042}
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "netstat -ltn | grep -q ':8080'"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Google Maps ─────────────────────────────────────────────────────────────
  maps-scraper:
    image: gosom/google-maps-scraper:latest
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    command: ["-web", "-addr", ":8080", "-c", "2"]
    ports:
      - "127.0.0.1:8085:8080"

  # ── registry-db ─────────────────────────────────────────────────────────────
  #
  # The state business registries, on local disk instead of Supabase.
  #
  # Supabase is on the free plan: 500 MB, and a project that reaches it goes
  # read-only, which takes the whole fleet down rather than one job. The
  # registry was 238 MB of a 276 MB database and is the only table that grows
  # without bound — five states of niche-scoped entities is 304k rows, and
  # whole-state slices across fifty would be tens of millions.
  #
  # Nothing user-facing reads it: no RLS policy references it, no Realtime
  # subscription watches it, the frontend has never queried it. It is a lookup
  # table the workers consult, so it belongs next to the workers, where disk is
  # 122 GB rather than 500 MB and the round trip is a container hop rather than
  # a pooled connection to us-east-1.
  #
  # Bound to 127.0.0.1 like every other LeadGen service — see docs/RUNBOOK §7.
  registry-db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    shm_size: 256m
    environment:
      POSTGRES_USER: ${REGISTRY_DB_USER:-registry}
      POSTGRES_PASSWORD: ${REGISTRY_DB_PASSWORD:?REGISTRY_DB_PASSWORD must be set}
      POSTGRES_DB: ${REGISTRY_DB_NAME:-registry}
      # This box also runs Odoo, n8n and three other Postgres instances. The
      # defaults assume the machine is yours alone; these do not.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      # The trigram and GIN indexes are the whole point of this database; give
      # the planner a reason to use them rather than sequential-scanning 304k
      # rows on local SSD.
      - -c
      - random_page_cost=1.1
      - -c
      - effective_cache_size=1GB
    volumes:
      - registry-db-data:/var/lib/postgresql/data
      - ./infra/registry-db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REGISTRY_DB_USER:-registry} -d ${REGISTRY_DB_NAME:-registry}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── optional local pooler (only for self-hosted Postgres) ───────────────────
  pgbouncer:
    profiles: ["local-pool"]
    image: edoburu/pgbouncer:v1.23.1-p2
    restart: unless-stopped
    mem_limit: 128m
    environment:
      DB_HOST: ${SUPABASE_DB_HOST}
      DB_PORT: ${SUPABASE_DB_PORT:-5432}
      DB_USER: ${SUPABASE_DB_USER}
      DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      DB_NAME: ${SUPABASE_DB_NAME:-postgres}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    ports:
      - "127.0.0.1:6432:6432"

  # ── workers ─────────────────────────────────────────────────────────────────
  # Default profile = the roles Phase 2 exercises.

  maps-worker:
    <<: *worker-base
    environment:
      <<: *worker-env
      WORKER_ROLE: maps
      MAPS_PROXY_REQUIRE_COUNTRY: ${DECODO_COUNTRY:-us}
    ports: ["127.0.0.1:9101:9100"]

  crawl-worker:
    <<: *worker-base
    environment:
      <<: *worker-env
      WORKER_ROLE: crawl
    # No fixed host port — this is the one that gets --scale'd.
    expose: ["9100"]

  enrich-worker:
    <<: *worker-base
    environment:
      <<: *worker-env
      WORKER_ROLE: enrich
    ports: ["127.0.0.1:9106:9100"]

  verify-worker:
    <<: *worker-base
    environment:
      <<: *worker-env
      WORKER_ROLE: verify
    ports: ["127.0.0.1:9107:9100"]

  scheduler:
    <<: *worker-base
    environment:
      <<: *worker-env
      WORKER_ROLE: scheduler
      # The reconcile loop is a singleton. Never scale this service.
      WORKER_CONCURRENCY: 1
    ports: ["127.0.0.1:9108:9100"]

  # ── Phase 3 naming stages ───────────────────────────────────────────────────
  #
  # Promoted out of the `full` profile: `crawl:site → registry:match →
  # [serp:owner] → enrich:lead` is the default pipeline from Phase 3 on, so a
  # default-profile `up` that omitted these would leave every lead parked
  # between crawl and enrichment.
  #
  # **This is the connection ceiling.** Supavisor allows ~15 session-mode
  # clients project-wide, graphile-worker needs session mode for LISTEN/NOTIFY,
  # and each worker is capped at 2. Seven workers ≈ 14 slots. An eighth
  # crash-loops on EMAXCONNSESSION — so linkedin-worker stays behind `full`,
  # and Phase 4 has to scale something down before it can start.
  registry-worker:
    <<: *worker-base
    environment:
      <<: *worker-env
      WORKER_ROLE: registry
    ports: ["127.0.0.1:9105:9100"]

  serp-worker:
    <<: *worker-base
    environment:
      <<: *worker-env
      WORKER_ROLE: serp
    ports: ["127.0.0.1:9102:9100"]

  # Phase 4. Starting this makes eight workers — see the note above.
  linkedin-worker:
    <<: *worker-base
    profiles: ["full"]
    environment:
      <<: *worker-env
      WORKER_ROLE: linkedin
    ports: ["127.0.0.1:9104:9100"]

volumes:
  # Registry data survives a container rebuild. Losing it is not fatal —
  # every state is re-ingestable from its adapter — but re-ingesting FL is a
  # 1.8 GB download and fifteen minutes.
  registry-db-data:
